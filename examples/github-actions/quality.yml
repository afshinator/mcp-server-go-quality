# Example: Run go-quality in your own CI pipeline
#
# This workflow calls the MCP server via stdio to check your Go code.
# Requires the server binary on PATH, or use go run.

name: Go Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Install go-quality
        run: go install github.com/afshinator/mcp-server-go-quality/cmd/go-quality@latest

      - name: Run checks
        run: go-quality --json . | jq '.diagnostics'
