# Dev iteration — skip nilaway for fast feedback
# Use with: {"tool": "run_code_checks", "tools": ["golangci-lint", "govulncheck"]}
timeout: 3m

# Tool versions are optional: omit `version` to use the pinned default
# (see internal/config/config.go). Only set it to override a pin.
tools:
  golangci-lint:
  govulncheck:
  nilaway:
