name: Pinned tool drift

on:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  check-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.9"
      - name: Check tool pins against latest module versions
        run: go test -count=1 ./internal/config/...
