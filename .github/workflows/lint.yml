name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - run: go install mvdan.cc/gofumpt@latest

      - run: gofumpt -d . | grep -q . && exit 1 || exit 0
        name: Check formatting
