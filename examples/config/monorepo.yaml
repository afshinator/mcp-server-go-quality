# Monorepo — exclude vendor paths from nilaway
timeout: 10m

# Tool versions are optional: omit `version` to use the pinned default
# (see internal/config/config.go). Only set it to override a pin.
tools:
  golangci-lint:
  govulncheck:
  nilaway:
    extra_args: ["--exclude-pkgs=github.com/myorg/vendor", "--exclude-pkgs=github.com/myorg/generated"]
